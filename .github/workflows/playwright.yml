name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm' # වේගවත් බිල්ඩ් එකක් සඳහා cache එකතු කිරීම

    - name: Install dependencies
      run: npm ci # npm install වෙනුවට 'ci' භාවිතය වඩාත් සුදුසුයි (clean install)

    - name: Install Playwright Browsers with Deps
      # Permission denied ගැටලුව සඳහා sudo භාවිතා කරමු
      run: sudo npx playwright install --with-deps

    - name: Run Playwright tests
      # අවසර ලබා දී පරීක්ෂණ ධාවනය කරන්න
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30